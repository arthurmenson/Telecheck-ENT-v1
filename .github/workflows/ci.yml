name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Validate OpenAPI/GraphQL contracts if present
      - name: Validate OpenAPI
        run: |
          if [ -f schema/openapi.yaml ]; then
            npx @apidevtools/swagger-cli validate schema/openapi.yaml
          else
            echo "No OpenAPI found; skip"
          fi

  migrate-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Prisma migrate diff (if Prisma exists)
        run: |
          if [ -f apps/api/prisma/schema.prisma ] || [ -f server/prisma/schema.prisma ]; then
            npx prisma migrate diff --from-empty --to-schema-datamodel $(git ls-files | grep 'prisma/schema.prisma' | head -n1)
          else
            echo "No Prisma schema; skip"
          fi

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Storybook build (if configured)
        run: npm run build:storybook --if-present
      - name: Chromatic (if token provided)
        run: |
          if [ -n "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            npx chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --exit-zero-on-changes=false
          else
            echo "No Chromatic token; skip"
          fi
