openapi: 3.0.3
info:
  title: Telecheck EMR API
  version: 1.0.0
  description: API for Telecheck Healthcare Management Platform
paths:
  /auth/login:
    post:
      summary: User authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
        "401":
          description: Authentication failed

  /patients:
    get:
      summary: Get all patients
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
    post:
      summary: Create new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
      responses:
        "201":
          description: Patient created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string

  /encounters:
    post:
      summary: Create new encounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patientId:
                  type: string
                providerId:
                  type: string
                encounterType:
                  type: string
                notes:
                  type: string
      responses:
        "201":
          description: Encounter created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string

  /lab-results:
    post:
      summary: Upload lab results
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                patientId:
                  type: string
      responses:
        "200":
          description: Lab results processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  analysis:
                    type: object

  /medications:
    get:
      summary: Get patient medications
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of medications
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    dosage:
                      type: string
                    interactions:
                      type: array
                      items:
                        type: object

components:
  schemas:
    Patient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]

    Encounter:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        providerId:
          type: string
        encounterType:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    LabResult:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        testName:
          type: string
        results:
          type: object
        analysis:
          type: object
        createdAt:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
